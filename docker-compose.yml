services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bis
      POSTGRES_PASSWORD: bis
      POSTGRES_DB: bis_standards
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://bis:bis@db:5432/bis_standards
    depends_on:
      - db
    volumes:
      - ./data:/app/data

  ui:
    build: .
    command: streamlit run frontend/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api

volumes:
  pgdata:
